# Compose produção-like (API + Worker + Web + Postgres + Redis).
# Uso (raiz):
#   1) Preencha .env: JWT_*, POSTGRES_*, REDIS_PASSWORD, CORS/URLs (sem defaults fracos).
#   2) docker compose -f docker-compose.prod.yml --env-file .env config
#   3) docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Dev continua em docker-compose.yml (só PG + Redis; apps no host com PROCESS_ROLE=all).
#
# REDIS_PASSWORD: obrigatório. Gere URL-safe, ex.: openssl rand -hex 32
# (caracteres especiais na senha exigem percent-encoding na URL — evite).

x-api-env: &api-env
  NODE_ENV: production
  API_PORT: 3001
  API_HOST: 0.0.0.0
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=${DATABASE_CONNECTION_LIMIT:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
  CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in .env}
  API_PUBLIC_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL in .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ALLOW_BILLING_DEMO: 'false'
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - agenda_pro_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}',
      ]
    volumes:
      - agenda_pro_redis_prod:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: api
    ports:
      - '${API_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/api/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]

  # BullMQ notifications + reconcile PIX (mesma imagem; sem HTTP).
  # Escala: preferir 1 réplica até haver leader election no reconcile.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'apps/api/dist/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PROCESS_ROLE: worker
    healthcheck:
      disable: true
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    networks: [internal]

volumes:
  agenda_pro_pgdata_prod:
  agenda_pro_redis_prod:

networks:
  internal:
    driver: bridge
