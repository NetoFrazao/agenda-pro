name: CD

# Build → push GHCR → deploy reproduzível com migrate deploy.
# Secrets de deploy (opcionais): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Vars: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_APP_URL (build do Web)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Só build/push (sem SSH deploy)'
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.meta-api.outputs.image }}
      web_image: ${{ steps.meta-web.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image tags
        id: meta-api
        run: |
          BASE="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/agenda-pro-api"
          echo "image=${BASE}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Web image tags
        id: meta-web
        run: |
          BASE="${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/agenda-pro-web"
          echo "image=${BASE}:${{ steps.meta.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta-api.outputs.image }}
            ${{ steps.meta-api.outputs.base }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Resolve Web public URLs
        id: web-env
        run: |
          echo "api_url=${NEXT_PUBLIC_API_URL:-https://api.example.com}" >> "$GITHUB_OUTPUT"
          echo "app_url=${NEXT_PUBLIC_APP_URL:-https://app.example.com}" >> "$GITHUB_OUTPUT"
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.web-env.outputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.web-env.outputs.app_url }}
          tags: |
            ${{ steps.meta-web.outputs.image }}
            ${{ steps.meta-web.outputs.base }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy + migrate
    runs-on: ubuntu-latest
    needs: build-push
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.skip_deploy != true
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_* secrets ausentes — imagens publicadas; deploy SSH skipped."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy (pull + migrate + up)
        if: steps.gate.outputs.skip != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          WEB_IMAGE: ${{ needs.build-push.outputs.web_image }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/cd_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "${HOME}/.ssh/cd_key"
          REMOTE_PATH="${DEPLOY_PATH:-~/agenda-pro}"
          ssh -i "${HOME}/.ssh/cd_key" -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export API_IMAGE='${API_IMAGE}' WEB_IMAGE='${WEB_IMAGE}' DEPLOY_PATH='${REMOTE_PATH}'; cd '${REMOTE_PATH}' && bash scripts/deploy-release.sh"

      - name: Manual deploy instructions
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "Imagens prontas:"
          echo "  API: ${{ needs.build-push.outputs.api_image }}"
          echo "  Web: ${{ needs.build-push.outputs.web_image }}"
          echo "No host: API_IMAGE=... WEB_IMAGE=... ./scripts/deploy-release.sh"
