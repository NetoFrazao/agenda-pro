# Overlay TLS (Caddy) para caminho prod-like.
# Requer Docker Compose v2.24+ (!reset / !override).
#
# Uso:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml --env-file .env config
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml --env-file .env up -d --build
#
# Env:
#   TLS_DOMAIN=app.example.com          # host público (web)
#   TLS_API_DOMAIN=api.example.com      # host API (pode ser o mesmo com path /api)
#   CADDY_EMAIL=ops@example.com         # ACME Let's Encrypt
#   Ou TLS local (mkcert): monte certificados em ./deploy/certs
#
# Breaking: remove publicação host de :3000/:3001 — tráfego só via :80/:443.

services:
  api:
    ports: !reset []

  web:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:?Set TLS_DOMAIN in .env}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - agenda_pro_caddy_data:/data
      - agenda_pro_caddy_config:/config
      - ./deploy/certs:/etc/caddy/certs:ro
    # Caddy alpine: health via caddy binary (sem wget garantido)
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

volumes:
  agenda_pro_caddy_data:
  agenda_pro_caddy_config:
